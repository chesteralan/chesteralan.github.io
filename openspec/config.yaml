schema: spec-driven

context: |
  Tech stack: React 19, TypeScript, Vite, Tailwind CSS 3, Firebase (Firestore, Cloud Functions), framer-motion, lucide-react
  Routing: react-router-dom v7 with BrowserRouter
  Deployment: GitHub Pages via docs/ folder, CI via GitHub Actions
  Styling: Tailwind CSS with custom design tokens (primary/accent/surface), CSS utility layer in index.css
  Components: Layout, Navbar, Footer, ScrollReveal, ScrollToTop, ThemeToggle, ProjectCard
  Pages: Home, About, Projects, Extensions, Contact
  Data: src/data/portfolio.ts (projects, extensions, skills, socialLinks)
  Firebase Functions: functions/index.js (contact form → Slack webhook + Firestore)
  Conventions: No comments in code, minimal state, functional components, lucide-react for icons

